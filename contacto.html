    </ul>

<section class="section contacto">
  <div class="contact-inner">
    <div class="contact-info fade-in">
      <p class="eyebrow">Contacto</p>
      <h2>Hablemos de tu proyecto</h2>
      <p>Cuéntanos qué necesitas. Te responderemos lo antes posible.</p>
      <div class="contact-row">
        <span class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <span>Bucaramanga, Santander, Colombia</span>
      </div>
      <div class="contact-row">
        <span class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <span>admin@ecommercecol.com</span>
      </div>
      <div class="contact-row">
        <span class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg></span>
        <span>+57 301 461 5716</span>
      </div>
    </div>
    <form class="contact-form fade-in" id="contactForm">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com">
      </div>
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" placeholder="Cuéntanos sobre tu proyecto..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Enviar mensaje</button>
    </form>
  </div>
</section>

<footer>
  <p>© <span id="year"></span> Ecommerce Consulting S.A.S. · Bucaramanga, Colombia</p>
</footer>
